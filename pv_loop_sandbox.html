<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV loop sandbox (neonatal)</title>
<style>
:root{
  --color-text-primary:#0d1117;
  --color-text-secondary:#3a4453;
  --color-text-tertiary:#5a6473;
  --color-background-primary:#ffffff;
  --color-background-secondary:#eef0f3;
  --color-background-tertiary:#e2e6eb;
  --border-radius-md:6px;
}
html,body{margin:0;padding:0}
body{
  padding:14px 18px;
  background:var(--color-background-primary);
  color:var(--color-text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
}
.ts{font-size:13px;fill:var(--color-text-secondary);font-family:inherit}
.th{font-size:14px;font-weight:600;font-family:inherit}
.ax-title{font-size:14px;font-weight:500;fill:var(--color-text-primary);font-family:inherit}
.svg-wrap{width:100%;aspect-ratio:680/380}
.svg-wrap svg{width:100%;height:100%;display:block}
.panel-title{font-size:14px;font-weight:600;color:var(--color-text-primary);margin:0 0 2px 4px}
.panel-title .panel-sub{font-weight:400;color:var(--color-text-secondary);margin-left:6px}
.app{display:flex;flex-direction:column;gap:12px;max-width:1600px;margin:0 auto}
.plot-row{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:720px){
  .plot-row{grid-template-columns:1fr 1fr}
}
/* RV hidden: hide RV panel, RV chips, PA slider, centre LV at side-by-side
   size on wide screens; on narrow screens LV just keeps its full width. */
.app.rv-off .rv-wrap{display:none}
.app.rv-off .rv-metric{display:none}
.app.rv-off .sr-pa{display:none}
@media (min-width:720px){
  .app.rv-off .plot-row{grid-template-columns:1fr;max-width:50%;margin:0 auto}
}
.view-toggle{margin-bottom:6px}
.rv-toggle{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;font-size:14px;font-family:inherit;font-weight:500;color:var(--color-text-primary);background:var(--color-background-secondary);border:1px solid transparent;border-radius:var(--border-radius-md);cursor:pointer;line-height:1.2}
.rv-toggle:hover{background:var(--color-background-tertiary)}
.rv-toggle:focus-visible{outline:2px solid #3FA88A;outline-offset:2px}
.rv-toggle .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3FA88A}
.app.rv-off .rv-toggle .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--color-text-tertiary)}
.controls-col{display:flex;flex-direction:column;gap:6px}
.control-rows{display:grid;grid-template-columns:1fr;column-gap:24px}
@media (min-width:760px){
  .control-rows{grid-template-columns:1fr 1fr}
}
#metrics{display:flex;flex-wrap:wrap;gap:6px}
.sr{display:grid;grid-template-columns:140px 1fr 88px;gap:12px;align-items:center;margin-bottom:5px}
.sr label{font-size:14px;color:var(--color-text-secondary)}
.sr .v{font-size:15px;font-weight:600;text-align:right;color:var(--color-text-primary);font-variant-numeric:tabular-nums}
.sr.b label{color:var(--color-text-primary);font-weight:500}
.sr.b label::after{content:' ↓'}
.note{margin-top:8px;font-size:13px;color:var(--color-text-tertiary);font-style:italic;line-height:1.5}
.metric{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);font-size:14px}
.metric-label{color:var(--color-text-secondary);font-size:13px}
.metric-value{font-weight:600;font-variant-numeric:tabular-nums}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.preset{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;font-size:14px;font-family:inherit;font-weight:500;color:var(--color-text-primary);background:var(--color-background-secondary);border:1px solid transparent;border-radius:var(--border-radius-md);cursor:pointer;line-height:1.2;white-space:nowrap}
.preset:hover{background:var(--color-background-tertiary)}
.preset.active{background:#378ADD;color:#fff;border-color:#2c6ec0}
.preset .kbd{display:inline-block;min-width:18px;padding:1px 5px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;background:var(--color-background-primary);color:var(--color-text-secondary);border-radius:3px}
.preset.active .kbd{background:rgba(255,255,255,0.25);color:#fff}
.preset:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
.help{margin-top:10px;font-size:12px;color:var(--color-text-tertiary)}
.help .kbd{display:inline-block;padding:1px 5px;font-size:12px;font-weight:600;background:var(--color-background-secondary);border-radius:3px;font-family:inherit}
</style>
</head>
<body>
<div class="app">
<div class="plot-row">
<div class="svg-wrap lv-wrap">
<div class="panel-title">Left ventricle <span class="panel-sub">— systemic circulation</span></div>
<svg viewBox="0 0 680 380" role="img" preserveAspectRatio="xMidYMid meet">
<title>Left ventricle pressure-volume loop</title>
<desc>Interactive LV PV loop where preload, afterload, contractility, and ventricular stiffness vary independently.</desc>
<defs>
<marker id="ax-arrow-lv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary)"/></marker>
</defs>

<line x1="100" y1="325" x2="625" y2="325" stroke="var(--color-text-secondary)" stroke-width="1" marker-end="url(#ax-arrow-lv)"/>
<line x1="100" y1="325" x2="100" y2="15" stroke="var(--color-text-secondary)" stroke-width="1" marker-end="url(#ax-arrow-lv)"/>

<g class="axis-ticks"></g>

<text class="ax-title" x="35" y="170" text-anchor="middle" transform="rotate(-90 35 170)">LV pressure (mmHg)</text>
<text class="ax-title" x="362" y="362" text-anchor="middle">LV volume (mL)</text>

<g class="loop-g">
<path class="edpvr" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 4" d=""/>
<line class="espvr" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" x1="0" y1="0" x2="0" y2="0"/>
<text class="lab-espvr th" fill="#D85A30">ESPVR</text>
<text class="lab-edpvr th" fill="#1D9E75">EDPVR</text>
<path class="loop-fill" fill="#378ADD" opacity="0.15" d=""/>
<path class="loop" fill="none" stroke="#378ADD" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" d=""/>
</g>
</svg>
</div>

<div class="svg-wrap rv-wrap">
<div class="panel-title">Right ventricle <span class="panel-sub">— pulmonary circulation</span></div>
<svg viewBox="0 0 680 380" role="img" preserveAspectRatio="xMidYMid meet">
<title>Right ventricle pressure-volume loop</title>
<desc>Interactive RV PV loop. RV preload is tied to LV preload (shared venous return), RV contractility scales with LV contractility, and the pulmonary pressure slider sets the RV afterload.</desc>
<defs>
<marker id="ax-arrow-rv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--color-text-secondary)"/></marker>
</defs>

<line x1="100" y1="325" x2="625" y2="325" stroke="var(--color-text-secondary)" stroke-width="1" marker-end="url(#ax-arrow-rv)"/>
<line x1="100" y1="325" x2="100" y2="15" stroke="var(--color-text-secondary)" stroke-width="1" marker-end="url(#ax-arrow-rv)"/>

<g class="axis-ticks"></g>

<text class="ax-title" x="35" y="170" text-anchor="middle" transform="rotate(-90 35 170)">RV pressure (mmHg)</text>
<text class="ax-title" x="362" y="362" text-anchor="middle">RV volume (mL)</text>

<g class="loop-g">
<path class="edpvr" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 4" d=""/>
<line class="espvr" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" x1="0" y1="0" x2="0" y2="0"/>
<text class="lab-espvr th" fill="#D85A30">ESPVR</text>
<text class="lab-edpvr th" fill="#1D9E75">EDPVR</text>
<path class="loop-fill" fill="#3FA88A" opacity="0.15" d=""/>
<path class="loop" fill="none" stroke="#3FA88A" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" d=""/>
</g>
</svg>
</div>
</div>

<div class="controls-col">
<div class="view-toggle"><button type="button" id="rv-toggle" class="rv-toggle" aria-label="Toggle RV loop visibility"><span class="dot"></span> RV loop · on</button></div>
<div class="presets" id="presets"></div>
<div class="control-rows">
<div class="control-col">
<div class="sr"><label>Preload</label><input type="range" id="preload" min="2" max="12" value="6" step="0.2"/><span class="v" id="preload-v">6.0 mL</span></div>
<div class="sr"><label>Afterload</label><input type="range" id="afterload" min="15" max="70" value="35" step="1"/><span class="v" id="afterload-v">35 mmHg</span></div>
<div class="sr b"><label>Contractility</label><input type="range" id="contract" min="3" max="20" value="10" step="0.5"/><span class="v" id="contract-v">10.0</span></div>
<div class="sr b"><label>Stiffness</label><input type="range" id="stiff" min="0.3" max="4" value="1" step="0.1"/><span class="v" id="stiff-v">1.0×</span></div>
</div>
<div class="control-col">
<div class="sr"><label>Body weight</label><input type="range" id="weight" min="0.5" max="5" value="3" step="0.1"/><span class="v" id="weight-v">3.0 kg</span></div>
<div class="sr"><label>Heart rate</label><input type="range" id="hr" min="80" max="200" value="140" step="1"/><span class="v" id="hr-v">140 bpm</span></div>
<div class="sr sr-pa"><label>PA pressure</label><input type="range" id="pa" min="8" max="70" value="20" step="1"/><span class="v" id="pa-v">20 mmHg</span></div>
</div>
</div>
<div class="help"><span class="kbd">1</span>–<span class="kbd">9</span> jump to a preset · <span class="kbd">←</span> <span class="kbd">→</span> nudge the slider you last touched · <span class="kbd">R</span> toggle RV</div>
</div>

<div id="metrics"></div>
</div>

<script>
// --- Configuration ---------------------------------------------------------
// All axis ranges and physiological parameters live here, organised per
// chamber. Adding the RV (or an adult version, or any other chamber) is
// a config addition rather than a code change -- the render functions
// already take axes/model as parameters.
const CONFIG = {
  lv: {
    axes: {
      Vmin: 0, Vmax: 15,
      Pmin: 0, Pmax: 100,
      // SVG plot area (left/right of X axis, bottom/top of Y axis).
      // viewBox is 0 0 680 380 so y0/y1 are inside that box.
      x0: 100, x1: 625,
      y0: 325, y1: 15,
      vTicks: [0, 3, 6, 9, 12, 15],
      pTicks: [0, 20, 40, 60, 80, 100],
    },
    model: {
      V0: -2,                  // ESPVR volume-axis intercept (mL). Negative is
                               // fine -- it's the linear extrapolation, not the
                               // true unstressed volume. Tuned so the Normal
                               // preset gives EF ~65%.
      pedV_a: 0.20,            // EDPVR quadratic coefficient
      pedV_b: 0.70,            // EDPVR linear coefficient
      pedV_thresh: 2,          // EDP = 0 for V <= this (mL)
      AVO_to_AVC_ratio: 1.15,  // aortic valve close / open pressure ratio
      SV_min: 0.2,             // minimum stroke volume clamp (mL)
      ESV_min: 0.3,            // minimum end-systolic volume (mL)
      peak_min_above_AVC: 3,   // visual minimum pulse pressure (mmHg)
      peak_max: 95,            // visual cap so loops stay inside axis at
                               // extreme contractility (axis is 0-100)
      loopShape: 'lv',         // 'lv' = symmetric cubic-Bezier arch
                               // (rectangular/trapezoidal -- standard LV
                               // textbook shape)
    },
  },
  rv: {
    axes: {
      Vmin: 0, Vmax: 15,
      Pmin: 0, Pmax: 60,
      x0: 100, x1: 625,
      y0: 325, y1: 15,
      vTicks: [0, 3, 6, 9, 12, 15],
      pTicks: [0, 15, 30, 45, 60],
    },
    model: {
      V0: -1,                  // less negative than LV -- RV chamber sits a
                               // bit higher on the volume axis at zero pressure
      pedV_a: 0.18,
      pedV_b: 0.65,
      pedV_thresh: 2,
      AVO_to_AVC_ratio: 1.20,  // RV outflow has slightly more decay between
                               // peak and valve closure than LV does
      SV_min: 0.2,
      ESV_min: 0.3,
      peak_min_above_AVC: 3,
      peak_max: 57,            // visual cap inside the 0-60 RV pressure axis
      loopShape: 'rv',         // 'rv' = triangular, with the ejection drawn
                               // as a Q-Bezier slope from (EDV, PA-diastolic)
                               // up to (ESV, peak). Matches the published
                               // normal RV PV loop (Sunagawa & Maughan,
                               // Brimioulle 2003, Naeije 2014, Vonk
                               // Noordegraaf 2017 JACC) -- the low-resistance
                               // pulmonary bed produces an early-rising,
                               // late-peaking pressure profile, not the LV's
                               // flat-topped plateau.
    },
  },
};

// --- Pure functions (no DOM) ----------------------------------------------
function makeScales(a) {
  const xs = V => a.x0 + (V - a.Vmin) / (a.Vmax - a.Vmin) * (a.x1 - a.x0);
  const ys = P => a.y0 + (P - a.Pmin) / (a.Pmax - a.Pmin) * (a.y1 - a.y0);
  return { xs, ys };
}

function makePedV(m) {
  return (V, k) => V > m.pedV_thresh
    ? k * (m.pedV_a * (V - m.pedV_thresh) * (V - m.pedV_thresh)
         + m.pedV_b * (V - m.pedV_thresh))
    : 0;
}

function computeLoop(state, m) {
  const pedV = makePedV(m);
  const EDV = state.preload;
  const AVO = state.afterload;
  const E = state.E;
  const k = state.k;
  const EDP = pedV(EDV, k);
  const AVC = AVO * m.AVO_to_AVC_ratio;
  const Pmax = E * (EDV - m.V0);

  let ESV = m.V0 + AVC / E;
  if (ESV >= EDV - m.SV_min) ESV = EDV - m.SV_min;
  if (ESV < m.ESV_min) ESV = m.ESV_min;

  let peak = Math.min(Pmax, (AVC + Pmax) / 2);
  if (peak < AVC + m.peak_min_above_AVC) peak = AVC + m.peak_min_above_AVC;
  if (peak > m.peak_max) peak = m.peak_max;

  const D_p = pedV(ESV, k);
  const SV = Math.max(0, EDV - ESV);
  const EF = EDV > 0 ? Math.round(SV / EDV * 100) : 0;

  return { EDV, ESV, EDP, AVO, AVC, peak, Pmax, SV, EF, D_p };
}

// --- Drawing (DOM) ---------------------------------------------------------
function drawAxes(svg, axes, scales) {
  const { xs, ys } = scales;
  const g = svg.querySelector('.axis-ticks');
  let html = '';
  for (const V of axes.vTicks) {
    const x = xs(V);
    html += `<line x1="${x}" y1="${axes.y0}" x2="${x}" y2="${axes.y0 + 5}" stroke="var(--color-text-secondary)" stroke-width=".5"/>`;
    html += `<text class="ts" x="${x}" y="${axes.y0 + 20}" text-anchor="middle">${V}</text>`;
  }
  for (const P of axes.pTicks) {
    const y = ys(P);
    html += `<line x1="${axes.x0 - 5}" y1="${y}" x2="${axes.x0}" y2="${y}" stroke="var(--color-text-secondary)" stroke-width=".5"/>`;
    html += `<text class="ts" x="${axes.x0 - 9}" y="${y + 4}" text-anchor="end">${P}</text>`;
  }
  g.innerHTML = html;
}

// renderLoop draws one loop into the supplied <g> group. The group must
// contain elements with classes .espvr, .edpvr, .lab-espvr, .lab-edpvr,
// .loop, .loop-fill. Looking up by group-scoped class (not document-wide
// id) is what makes "two loops in the same SVG" possible later for the
// before/after overlay feature.
function renderLoop(state, axes, scales, model, group) {
  const { xs, ys } = scales;
  const d = computeLoop(state, model);
  const pedV = makePedV(model);

  // ESPVR: linear from (V0, 0); extend until just inside the top/right axes.
  const Pmax_show = axes.Pmax - 5;
  const Vmax_show = axes.Vmax - 0.5;
  const Vend = Math.min(model.V0 + Pmax_show / state.E, Vmax_show);
  const Pend = state.E * (Vend - model.V0);

  const espvr = group.querySelector('.espvr');
  espvr.setAttribute('x1', xs(model.V0));
  espvr.setAttribute('y1', ys(0));
  espvr.setAttribute('x2', xs(Vend));
  espvr.setAttribute('y2', ys(Pend));

  const labE = group.querySelector('.lab-espvr');
  labE.setAttribute('x', xs(Vend) + 6);
  labE.setAttribute('y', ys(Pend) + 4);

  // EDPVR: sample across the volume axis.
  const step = (axes.Vmax - axes.Vmin) / 60;
  let edpD = '';
  for (let V = axes.Vmin; V <= axes.Vmax + 1e-6; V += step) {
    edpD += (edpD ? 'L' : 'M') + ' ' + xs(V).toFixed(2) + ' ' + ys(pedV(V, state.k)).toFixed(2) + ' ';
  }
  group.querySelector('.edpvr').setAttribute('d', edpD);
  const labD = group.querySelector('.lab-edpvr');
  labD.setAttribute('x', xs(axes.Vmax) - 38);
  // Clamp the EDPVR label inside the visible plot area so it doesn't
  // float off the top at high stiffness (k=2.5+, the curve can exit
  // through the pressure-axis maximum).
  const labD_y_raw = ys(pedV(axes.Vmax, state.k)) - 6;
  const labD_y_min = axes.y1 + 14;  // 14 px below the top edge
  labD.setAttribute('y', Math.max(labD_y_min, labD_y_raw));

  // Loop construction.
  //
  // Shared geometry (both LV and RV):
  //   D -> A   filling, traces the EDPVR curve from ESV up to EDV
  //   A -> B   isovolumic contraction, vertical from EDP to AVO
  // Then the ejection + relaxation portion differs by loopShape:
  //
  //   loopShape: 'lv'  (default, rectangular/trapezoidal LV abstraction)
  //     B -> C   ejection, cubic Bezier arching through peak mid-ejection
  //     C -> D   isovolumic relaxation, vertical from AVC to D_p
  //
  //   loopShape: 'rv'  (triangular, matches Sunagawa & Maughan / Brimioulle
  //                     2003 / Naeije 2014 / Vonk Noordegraaf 2017)
  //     B -> Peak  ejection, Q-Bezier sloping up-left with subtle outward
  //                bow. Peak pressure occurs at ESV (upper-left corner),
  //                reflecting the late-peaking RV pressure profile in a
  //                low-resistance pulmonary bed.
  //     Peak -> D  combined valve-closure + relaxation, single vertical
  //                drop. AVC and the isovolumic-relaxation distinction
  //                collapse for visual clarity.
  const xA = xs(d.EDV),  yA = ys(d.EDP);
  const xB = xA,         yB = ys(d.AVO);
  const xC = xs(d.ESV),  yC = ys(d.AVC);
  const xD = xC,         yD = ys(d.D_p);

  let fill = '';
  const N = 24;
  for (let i = 1; i <= N; i++) {
    const V = d.ESV + (d.EDV - d.ESV) * i / N;
    fill += 'L ' + xs(V).toFixed(2) + ' ' + ys(pedV(V, state.k)).toFixed(2) + ' ';
  }
  const yPeak = ys(d.peak);

  let ejection;
  if (model.loopShape === 'rv') {
    // Q-Bezier control point bows the slope outward (above the chord), so
    // pressure rises faster at the start of ejection than at the end --
    // matches the published RV pressure trace.
    const midX   = (xB + xC) / 2;
    const midY   = (yB + yPeak) / 2;
    const bowOff = (yB - yPeak) * 0.08;       // ~8 % of slope height
    const cpX    = midX;
    const cpY    = midY - bowOff;              // smaller y = above chord
    ejection = ' L ' + xB.toFixed(2) + ' ' + yB.toFixed(2)
             + ' Q ' + cpX.toFixed(2) + ' ' + cpY.toFixed(2) + ', '
                    + xC.toFixed(2) + ' ' + yPeak.toFixed(2)
             + ' L ' + xC.toFixed(2) + ' ' + yD.toFixed(2);
  } else {
    const ec1x = xB + (xC - xB) * 0.3, ec1y = yPeak;
    const ec2x = xB + (xC - xB) * 0.7, ec2y = yPeak;
    ejection = ' L ' + xB.toFixed(2) + ' ' + yB.toFixed(2)
             + ' C ' + ec1x.toFixed(2) + ' ' + ec1y.toFixed(2) + ', '
                    + ec2x.toFixed(2) + ' ' + ec2y.toFixed(2) + ', '
                    + xC.toFixed(2) + ' ' + yC.toFixed(2)
             + ' L ' + xD.toFixed(2) + ' ' + yD.toFixed(2);
  }
  const lp = 'M ' + xD.toFixed(2) + ' ' + yD.toFixed(2) + ' ' + fill
           + ejection
           + ' Z';
  group.querySelector('.loop').setAttribute('d', lp);
  group.querySelector('.loop-fill').setAttribute('d', lp);

  return d;
}

// --- UI wiring -------------------------------------------------------------
// Sliders the arrow-key nudge tracks. HR and weight are included so the
// presenter can fine-tune them mid-talk with arrow keys; weight is a
// patient parameter (changes infrequently) but still a slider for the
// "what if this were a 1 kg baby?" demonstration.
const SLIDERS = ['preload', 'afterload', 'contract', 'stiff', 'hr', 'weight', 'pa'];

// Clinical presets. The label is what appears on the button; the slider
// values are the four model inputs. Keys 1..9 map onto array positions.
const PRESETS = [
  { label: 'Normal',          preload: 6,  afterload: 35, E: 10, k: 1.0, pa: 20 },
  { label: 'Hypovolaemia',    preload: 3,  afterload: 30, E: 10, k: 1.0, pa: 18 },
  { label: 'PPHN',            preload: 4,  afterload: 30, E: 9,  k: 1.0, pa: 55 },
  { label: 'AVM (high output)', preload: 10, afterload: 22, E: 8, k: 1.0, pa: 28 },
  { label: 'Vasoplegia',      preload: 6,  afterload: 22, E: 10, k: 1.0, pa: 20 },
  { label: 'Closing PDA',     preload: 6,  afterload: 50, E: 10, k: 1.0, pa: 20 },
  { label: 'Inotropic support', preload: 5, afterload: 32, E: 15, k: 1.0, pa: 20 },
  { label: 'Volume overload', preload: 10, afterload: 35, E: 10, k: 1.0, pa: 25 },
  { label: 'Diastolic dysfn', preload: 7,  afterload: 35, E: 10, k: 2.5, pa: 22 },
];

function readState() {
  return {
    preload:   +document.getElementById('preload').value,
    afterload: +document.getElementById('afterload').value,
    E:         +document.getElementById('contract').value,
    k:         +document.getElementById('stiff').value,
    hr:        +document.getElementById('hr').value,
    weight:    +document.getElementById('weight').value,
    pa:        +document.getElementById('pa').value,
  };
}

function updateSliderValues(state) {
  document.getElementById('preload-v').textContent   = state.preload.toFixed(1) + ' mL';
  document.getElementById('afterload-v').textContent = Math.round(state.afterload) + ' mmHg';
  document.getElementById('contract-v').textContent  = state.E.toFixed(1);
  document.getElementById('stiff-v').textContent     = state.k.toFixed(1) + '×';
  document.getElementById('hr-v').textContent        = Math.round(state.hr) + ' bpm';
  document.getElementById('weight-v').textContent    = state.weight.toFixed(1) + ' kg';
  document.getElementById('pa-v').textContent        = Math.round(state.pa) + ' mmHg';
}

function chip(label, value, extraClass) {
  const cls = 'metric' + (extraClass ? ' ' + extraClass : '');
  return '<span class="' + cls + '"><span class="metric-label">' + label
       + '</span><span class="metric-value">' + value + '</span></span>';
}

function updateMetrics(dLV, dRV, state) {
  // LV side ---------------------------------------------------------
  const sys = Math.round(dLV.peak);
  const dia = Math.round(dLV.AVO);
  const map = Math.round((2 * dia + sys) / 3);
  // CO = SV * HR  (SV in mL, HR in /min  ->  CO in mL/min directly).
  // Indexed per kg is how the neonatology bedside actually quotes it.
  const co       = Math.round(dLV.SV * state.hr);
  const co_kg    = Math.round(co / state.weight);
  const sv_kg    = (dLV.SV / state.weight).toFixed(1);
  // RV side ---------------------------------------------------------
  const pa_sys = Math.round(dRV.peak);
  const pa_dia = Math.round(dRV.AVO);
  document.getElementById('metrics').innerHTML = [
    chip('ESV',    dLV.ESV.toFixed(1) + ' mL'),
    chip('SV',     dLV.SV.toFixed(1)  + ' mL'),
    chip('SV/kg',  sv_kg              + ' mL/kg'),
    chip('EF',     dLV.EF             + '%'),
    chip('BP',     sys + '/' + dia    + ' mmHg'),
    chip('MAP',    map                + ' mmHg'),
    chip('CO',     co                 + ' mL/min'),
    chip('CO/kg',  co_kg              + ' mL/kg/min'),
    chip('EDP',    dLV.EDP.toFixed(1) + ' mmHg'),
    chip('RV SV',  dRV.SV.toFixed(1)  + ' mL',           'rv-metric'),
    chip('PA',     pa_sys + '/' + pa_dia + ' mmHg',      'rv-metric'),
    chip('RV EDP', dRV.EDP.toFixed(1) + ' mmHg',         'rv-metric'),
  ].join('');
}

const svgLV    = document.querySelector('.lv-wrap svg');
const scalesLV = makeScales(CONFIG.lv.axes);
drawAxes(svgLV, CONFIG.lv.axes, scalesLV);
const lvGroup  = svgLV.querySelector('.loop-g');

const svgRV    = document.querySelector('.rv-wrap svg');
const scalesRV = makeScales(CONFIG.rv.axes);
drawAxes(svgRV, CONFIG.rv.axes, scalesRV);
const rvGroup  = svgRV.querySelector('.loop-g');

// Coupling constants between LV and RV state. Conscious teaching choice:
// RV is derived from LV rather than independently controlled. Lets PPHN
// (raise PA pressure) and the response to the four LV levers be taught
// without doubling the slider count. Decoupling for niche cases (RV-
// specific cardiomyopathy) is a one-line change here.
const RV_E_FRACTION = 0.5;  // RV contractility = 0.5 * LV contractility

function update() {
  const state = readState();
  updateSliderValues(state);
  // LV loop -- HR and weight don't enter the loop geometry, they're
  // metric-side only.
  const dLV = renderLoop(
    { preload: state.preload, afterload: state.afterload, E: state.E, k: state.k },
    CONFIG.lv.axes, scalesLV, CONFIG.lv.model, lvGroup
  );
  // RV loop -- shared venous return (preload), reduced contractility,
  // shared stiffness, PA pressure as afterload.
  const dRV = renderLoop(
    { preload: state.preload,
      afterload: state.pa,
      E: state.E * RV_E_FRACTION,
      k: state.k },
    CONFIG.rv.axes, scalesRV, CONFIG.rv.model, rvGroup
  );
  updateMetrics(dLV, dRV, state);
}

// Build preset buttons. Done in JS rather than markup so that adding/
// renaming/reordering a preset is one PRESETS array edit.
const presetsEl = document.getElementById('presets');
presetsEl.innerHTML = PRESETS.map((p, i) =>
  '<button type="button" class="preset" data-idx="' + i + '" title="Press ' + (i+1) + '">'
  + '<span class="kbd">' + (i+1) + '</span> ' + p.label
  + '</button>'
).join('');

function applyPreset(i) {
  const p = PRESETS[i];
  if (!p) return;
  document.getElementById('preload').value   = p.preload;
  document.getElementById('afterload').value = p.afterload;
  document.getElementById('contract').value  = p.E;
  document.getElementById('stiff').value     = p.k;
  document.getElementById('pa').value        = p.pa;
  update();
  // Visual: highlight the active preset button. Cleared when the user
  // touches any slider (they've now diverged from the preset).
  for (const btn of presetsEl.querySelectorAll('.preset')) {
    btn.classList.toggle('active', +btn.dataset.idx === i);
  }
}

presetsEl.addEventListener('click', e => {
  const btn = e.target.closest('.preset');
  if (btn) applyPreset(+btn.dataset.idx);
});

// RV panel toggle. RV continues to render into its (hidden) group when
// off, so toggling back on is instant -- no first-frame flash. Hidden
// via CSS class on .app, which also collapses the plot row to a single
// column and centres the LV at its side-by-side width.
const rvToggleBtn = document.getElementById('rv-toggle');
const appEl = document.querySelector('.app');
let rvVisible = true;
function setRVVisible(on) {
  rvVisible = on;
  appEl.classList.toggle('rv-off', !on);
  rvToggleBtn.innerHTML = '<span class="dot"></span> RV loop · ' + (on ? 'on' : 'off');
}
rvToggleBtn.addEventListener('click', () => setRVVisible(!rvVisible));

// Track the last slider the user touched so arrow keys can nudge it
// even when focus has wandered to a button.
let lastSliderId = 'preload';

SLIDERS.forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    lastSliderId = id;
    // User moved a slider -> clear any active-preset highlight, since
    // the state no longer matches the preset.
    for (const btn of presetsEl.querySelectorAll('.preset.active')) {
      btn.classList.remove('active');
    }
    update();
  });
});

// Keyboard shortcuts.
// 1..9 -> jump to preset (works from anywhere on the page).
// ArrowLeft / ArrowRight -> nudge lastSliderId by one step, ONLY when
// focus is not on a range input (the browser already handles arrows
// natively when a slider has focus, and we don't want to double-fire).
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= '1' && e.key <= '9') {
    const idx = +e.key - 1;
    if (idx < PRESETS.length) {
      applyPreset(idx);
      e.preventDefault();
    }
    return;
  }
  if (e.key === 'r' || e.key === 'R') {
    // Don't intercept if focus is on a text input (defensive -- there
    // are no text inputs in this tool today, but cheap insurance).
    const focused = document.activeElement;
    if (focused && focused.tagName === 'INPUT' && focused.type !== 'range') return;
    setRVVisible(!rvVisible);
    e.preventDefault();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const focused = document.activeElement;
    if (focused && focused.tagName === 'INPUT' && focused.type === 'range') return;
    const slider = document.getElementById(lastSliderId);
    if (!slider) return;
    const step = +slider.step || 1;
    const min = +slider.min;
    const max = +slider.max;
    let next = +slider.value + (e.key === 'ArrowRight' ? step : -step);
    next = Math.max(min, Math.min(max, Math.round(next / step) * step));
    if (next === +slider.value) return;
    slider.value = next;
    // Dispatch 'input' so the existing slider handler runs (which
    // updates lastSliderId, clears preset highlight, and re-renders).
    slider.dispatchEvent(new Event('input', { bubbles: true }));
    e.preventDefault();
  }
});

// Initial render. Default to the Normal preset so the file opens on a
// recognisable loop rather than the slider default values (which happen
// to match Normal here, but won't always as the model evolves).
applyPreset(0);
</script>
</body>
</html>
